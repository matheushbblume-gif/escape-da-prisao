<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Nível 3 - Fuga Impossível</title>

    <style>

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 10px;
        }

        #info {
            font-size: 20px;
            margin-bottom: 5px;
        }

        canvas {
            background: #181818;
            border: 4px solid #666;
        }

        #mensagem {
            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: rgba(0, 0, 0, 0.96);

            padding: 30px;

            border: 3px solid white;

            border-radius: 15px;

            z-index: 10;

            min-width: 300px;
        }

        #mensagem h2 {
            margin-top: 0;
        }

        button {
            padding: 12px 20px;

            font-size: 18px;

            cursor: pointer;

            border: none;

            border-radius: 8px;

            margin-top: 10px;
        }


        /* CONTROLES DE CELULAR */
        #controlesMobile {
            display: none;
            position: fixed;
            left: 18px;
            bottom: 18px;
            width: 170px;
            height: 170px;
            z-index: 200;
            touch-action: none;
            user-select: none;
        }

        .controle {
            position: absolute;
            width: 58px;
            height: 58px;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 14px;
            background: rgba(255,255,255,0.22);
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }

        .controle:active {
            background: rgba(255,255,255,0.45);
        }

        #btnCima { left: 56px; top: 0; }
        #btnEsquerda { left: 0; top: 56px; }
        #btnBaixo { left: 56px; top: 112px; }
        #btnDireita { left: 112px; top: 56px; }

        @media (max-width: 768px), (pointer: coarse) {
            #controlesMobile { display: block; }
            canvas { max-width: 100vw; height: auto; }
            h1 { font-size: 22px; }
            #info { font-size: 14px; }
            #mensagem { min-width: 0; width: 80vw; }
        }

    </style>
</head>

<body>

<h1>🔴 NÍVEL 3 - FUGA IMPOSSÍVEL</h1>

<div id="info">

    ❤️ Vidas:
    <span id="vidas">3</span>

    &nbsp;&nbsp;&nbsp;

    🔑 Chaves:
    <span id="chaves">0</span>/2

    &nbsp;&nbsp;&nbsp;

    🟨 Plataforma:
    <span id="plataforma">DESATIVADA</span>

</div>

<canvas id="jogo" width="900" height="550"></canvas>



<div id="controlesMobile">
    <div class="controle" id="btnCima">⬆️</div>
    <div class="controle" id="btnEsquerda">⬅️</div>
    <div class="controle" id="btnBaixo">⬇️</div>
    <div class="controle" id="btnDireita">➡️</div>
</div>

<div id="mensagem">

    <h2 id="tituloMensagem"></h2>

    <p id="textoMensagem"></p>

    <button onclick="location.href='game.html'">
        Voltar aos níveis
    </button>

</div>


<script>

// ==========================================
// CANVAS
// ==========================================

const canvas = document.getElementById("jogo");

const ctx = canvas.getContext("2d");


// ==========================================
// ELEMENTOS DA INTERFACE
// ==========================================

const vidasTexto =
    document.getElementById("vidas");

const chavesTexto =
    document.getElementById("chaves");

const plataformaTexto =
    document.getElementById("plataforma");

const mensagem =
    document.getElementById("mensagem");

const tituloMensagem =
    document.getElementById("tituloMensagem");

const textoMensagem =
    document.getElementById("textoMensagem");


// ==========================================
// JOGADOR
// ==========================================

let jogador = {

    x: 50,

    y: 470,

    largura: 25,

    altura: 25,

    velocidade: 4
};


// ==========================================
// POLICIAIS
// ==========================================

let policiais = [

    {
        x: 430,
        y: 70,
        largura: 28,
        altura: 28,
        velocidade: 1.3
    },

    {
        x: 800,
        y: 120,
        largura: 28,
        altura: 28,
        velocidade: 1.3
    },

    {
        x: 450,
        y: 450,
        largura: 28,
        altura: 28,
        velocidade: 1.3
    },

    {
        x: 750,
        y: 450,
        largura: 28,
        altura: 28,
        velocidade: 1.3
    }

];


// ==========================================
// VIDAS
// ==========================================

let vidas = 3;


// ==========================================
// CHAVES
// ==========================================

let chaves = 0;


// ==========================================
// PLATAFORMA
// ==========================================

let plataformaAtivada = false;


// ==========================================
// JOGO TERMINADO
// ==========================================

let jogoTerminado = false;


// ==========================================
// PAREDES
// ==========================================

const paredes = [

    // BORDAS

    {
        x: 0,
        y: 0,
        w: 900,
        h: 20
    },

    {
        x: 0,
        y: 530,
        w: 900,
        h: 20
    },

    {
        x: 0,
        y: 0,
        w: 20,
        h: 550
    },

    {
        x: 880,
        y: 0,
        w: 20,
        h: 550
    },


    // PAREDES ESQUERDA

    {
        x: 130,
        y: 80,
        w: 25,
        h: 180
    },

    {
        x: 130,
        y: 340,
        w: 25,
        h: 110
    },


    // PAREDES CENTRAIS

    {
        x: 300,
        y: 70,
        w: 25,
        h: 170
    },

    {
        x: 300,
        y: 310,
        w: 25,
        h: 170
    },


    {
        x: 500,
        y: 70,
        w: 25,
        h: 150
    },

    {
        x: 500,
        y: 300,
        w: 25,
        h: 180
    },


    // PAREDES DIREITA

    {
        x: 680,
        y: 70,
        w: 25,
        h: 180
    },

    {
        x: 680,
        y: 330,
        w: 25,
        h: 120
    },


    // PAREDES HORIZONTAIS

    {
        x: 200,
        y: 100,
        w: 100,
        h: 25
    },

    {
        x: 200,
        y: 220,
        w: 100,
        h: 25
    },


    {
        x: 380,
        y: 150,
        w: 90,
        h: 25
    },


    {
        x: 550,
        y: 200,
        w: 100,
        h: 25
    },


    {
        x: 720,
        y: 150,
        w: 100,
        h: 25
    },


    {
        x: 720,
        y: 390,
        w: 100,
        h: 25
    }

];


// ==========================================
// PORTÃO DA SALA DAS CHAVES
// ==========================================

let portao = {

    x: 720,

    y: 250,

    w: 25,

    h: 100

};


// ==========================================
// SALA DAS CHAVES
// ==========================================

let salaChaves = {

    x: 710,

    y: 220,

    w: 150,

    h: 180

};


// ==========================================
// CHAVE 1
// ==========================================

let chave1 = {

    x: 770,

    y: 280,

    tamanho: 18,

    pega: false
};


// ==========================================
// CHAVE 2
// ==========================================

let chave2 = {

    x: 810,

    y: 350,

    tamanho: 18,

    pega: false
};


// ==========================================
// PORTA DE SAÍDA
// ==========================================

let porta = {

    x: 820,

    y: 45,

    w: 40,

    h: 60
};


// ==========================================
// PLATAFORMA
// ==========================================

let plataforma = {

    x: 200,

    y: 450,

    w: 70,

    h: 30
};


// ==========================================
// TECLAS
// ==========================================

let teclas = {};


// ==========================================
// KEYDOWN
// ==========================================

document.addEventListener("keydown", function(e) {

    teclas[e.key.toLowerCase()] = true;

});


// ==========================================
// KEYUP
// ==========================================

document.addEventListener("keyup", function(e) {

    teclas[e.key.toLowerCase()] = false;

});



// ==========================================
// CONTROLES DE CELULAR
// ==========================================

function configurarBotao(id, tecla) {
    const botao = document.getElementById(id);

    function pressionar(e) {
        e.preventDefault();
        teclas[tecla] = true;
    }

    function soltar(e) {
        e.preventDefault();
        teclas[tecla] = false;
    }

    botao.addEventListener("touchstart", pressionar, { passive: false });
    botao.addEventListener("touchend", soltar, { passive: false });
    botao.addEventListener("touchcancel", soltar, { passive: false });
    botao.addEventListener("mousedown", pressionar);
    botao.addEventListener("mouseup", soltar);
    botao.addEventListener("mouseleave", soltar);
}

configurarBotao("btnCima", "arrowup");
configurarBotao("btnEsquerda", "arrowleft");
configurarBotao("btnBaixo", "arrowdown");
configurarBotao("btnDireita", "arrowright");

// ==========================================
// COLISÃO
// ==========================================

function colisao(a, b) {

    return (

        a.x < b.x + b.w &&

        a.x + a.largura > b.x &&

        a.y < b.y + b.h &&

        a.y + a.altura > b.y

    );

}


// ==========================================
// VERIFICAR PAREDES
// ==========================================

function bateuParede(objeto, novoX, novoY) {

    let teste = {

        x: novoX,

        y: novoY,

        largura: objeto.largura,

        altura: objeto.altura
    };


    for (let parede of paredes) {

        if (

            colisao(

                teste,

                {
                    x: parede.x,
                    y: parede.y,
                    w: parede.w,
                    h: parede.h
                }

            )

        ) {

            return true;
        }

    }


    // O portão também bloqueia o jogador

    if (!plataformaAtivada) {

        if (

            colisao(

                teste,

                {
                    x: portao.x,
                    y: portao.y,
                    w: portao.w,
                    h: portao.h
                }

            )

        ) {

            return true;
        }

    }


    return false;
}


// ==========================================
// MOVIMENTO DO JOGADOR
// ==========================================

function moverJogador() {

    let novoX = jogador.x;

    let novoY = jogador.y;


    if (

        teclas["arrowleft"] ||

        teclas["a"]

    ) {

        novoX -= jogador.velocidade;

    }


    if (

        teclas["arrowright"] ||

        teclas["d"]

    ) {

        novoX += jogador.velocidade;

    }


    if (

        teclas["arrowup"] ||

        teclas["w"]

    ) {

        novoY -= jogador.velocidade;

    }


    if (

        teclas["arrowdown"] ||

        teclas["s"]

    ) {

        novoY += jogador.velocidade;

    }


    // Movimento horizontal

    if (

        !bateuParede(

            jogador,

            novoX,

            jogador.y

        )

    ) {

        jogador.x = novoX;

    }


    // Movimento vertical

    if (

        !bateuParede(

            jogador,

            jogador.x,

            novoY

        )

    ) {

        jogador.y = novoY;

    }

}


// ==========================================
// MOVIMENTO DOS POLICIAIS
// ==========================================
//
// IMPORTANTE:
// Eles NÃO verificam as paredes.
// Portanto atravessam tudo.
//

function moverPoliciais() {

    for (let policial of policiais) {

        let dx =
            jogador.x - policial.x;

        let dy =
            jogador.y - policial.y;


        let distancia =
            Math.sqrt(

                dx * dx +

                dy * dy

            );


        if (distancia === 0) {

            continue;

        }


        let direcaoX =
            dx / distancia;

        let direcaoY =
            dy / distancia;


        policial.x +=
            direcaoX *
            policial.velocidade;


        policial.y +=
            direcaoY *
            policial.velocidade;

    }

}


// ==========================================
// PLATAFORMA
// ==========================================

function verificarPlataforma() {

    if (plataformaAtivada) {

        return;
    }


    if (

        colisao(

            jogador,

            {
                x: plataforma.x,
                y: plataforma.y,
                w: plataforma.w,
                h: plataforma.h
            }

        )

    ) {

        plataformaAtivada = true;


        plataformaTexto.textContent =
            "ATIVADA!";


        // Abre o portão

    }

}


// ==========================================
// PEGAR CHAVES
// ==========================================

function verificarChaves() {


    if (!plataformaAtivada) {

        return;

    }


    if (!chave1.pega) {

        let distancia = Math.hypot(

            jogador.x - chave1.x,

            jogador.y - chave1.y

        );


        if (distancia < 30) {

            chave1.pega = true;

            chaves++;

            chavesTexto.textContent =
                chaves;

        }

    }


    if (!chave2.pega) {

        let distancia = Math.hypot(

            jogador.x - chave2.x,

            jogador.y - chave2.y

        );


        if (distancia < 30) {

            chave2.pega = true;

            chaves++;

            chavesTexto.textContent =
                chaves;

        }

    }

}


// ==========================================
// POLICIAL
// ==========================================

function verificarPoliciais() {

    for (let policial of policiais) {

        if (

            colisao(

                jogador,

                {
                    x: policial.x,
                    y: policial.y,
                    w: policial.largura,
                    h: policial.altura
                }

            )

        ) {

            perderVida();

            return;

        }

    }

}


// ==========================================
// PORTA
// ==========================================

function verificarPorta() {

    if (

        colisao(

            jogador,

            {
                x: porta.x,
                y: porta.y,
                w: porta.w,
                h: porta.h
            }

        )

    ) {

        if (chaves >= 2) {

            terminarJogo(

                "🚨 VOCÊ ESCAPOU!",

                "Você sobreviveu à fuga impossível!"

            );

        }

    }

}


// ==========================================
// PERDER VIDA
// ==========================================

function perderVida() {

    vidas--;

    vidasTexto.textContent =
        vidas;


    if (vidas <= 0) {

        terminarJogo(

            "💀 VOCÊ PERDEU!",

            "Os quatro policiais conseguiram pegar você."

        );

        return;

    }


    // Voltar para o início

    jogador.x = 50;

    jogador.y = 470;


    // Reposicionar policiais

    policiais[0].x = 430;
    policiais[0].y = 70;

    policiais[1].x = 800;
    policiais[1].y = 120;

    policiais[2].x = 450;
    policiais[2].y = 450;

    policiais[3].x = 750;
    policiais[3].y = 450;

}


// ==========================================
// FINAL
// ==========================================

function terminarJogo(titulo, texto) {

    if (jogoTerminado) {

        return;

    }


    jogoTerminado = true;


    tituloMensagem.textContent =
        titulo;


    textoMensagem.textContent =
        texto;


    mensagem.style.display =
        "block";


    if (titulo.includes("ESCAPOU")) {

        localStorage.setItem(

            "nivel4Liberado",

            "sim"

        );

    }

}


// ==========================================
// DESENHAR
// ==========================================

function desenhar() {

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    // ======================================
    // FUNDO
    // ======================================

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    // ======================================
    // SALA DAS CHAVES
    // ======================================

    ctx.fillStyle =
        plataformaAtivada

        ? "#263d26"

        : "#241b1b";


    ctx.fillRect(

        salaChaves.x,

        salaChaves.y,

        salaChaves.w,

        salaChaves.h

    );


    // ======================================
    // PAREDES
    // ======================================

    ctx.fillStyle =
        "#555";


    for (let parede of paredes) {

        ctx.fillRect(

            parede.x,

            parede.y,

            parede.w,

            parede.h

        );

    }


    // ======================================
    // PORTÃO
    // ======================================

    if (!plataformaAtivada) {

        ctx.fillStyle =
            "#e74c3c";

        ctx.fillRect(

            portao.x,

            portao.y,

            portao.w,

            portao.h

        );

    }


    // ======================================
    // PLATAFORMA
    // ======================================

    if (!plataformaAtivada) {

        ctx.fillStyle =
            "#f1c40f";

    } else {

        ctx.fillStyle =
            "#2ecc71";

    }


    ctx.fillRect(

        plataforma.x,

        plataforma.y,

        plataforma.w,

        plataforma.h

    );


    // Texto da plataforma

    ctx.fillStyle =
        "#000";

    ctx.font =
        "bold 13px Arial";

    ctx.fillText(

        plataformaAtivada
        ? "ABERTA"
        : "PISE",

        plataforma.x + 10,

        plataforma.y + 20

    );


    // ======================================
    // CHAVE 1
    // ======================================

    if (

        plataformaAtivada &&

        !chave1.pega

    ) {

        desenharChave(

            chave1.x,

            chave1.y

        );

    }


    // ======================================
    // CHAVE 2
    // ======================================

    if (

        plataformaAtivada &&

        !chave2.pega

    ) {

        desenharChave(

            chave2.x,

            chave2.y

        );

    }


    // ======================================
    // PORTA
    // ======================================

    if (chaves >= 2) {

        ctx.fillStyle =
            "#00ff66";

    } else {

        ctx.fillStyle =
            "#8b2222";

    }


    ctx.fillRect(

        porta.x,

        porta.y,

        porta.w,

        porta.h

    );


    // ======================================
    // JOGADOR
    // ======================================

    ctx.fillStyle =
        "#3498db";


    ctx.fillRect(

        jogador.x,

        jogador.y,

        jogador.largura,

        jogador.altura

    );


    // ======================================
    // POLICIAIS
    // ======================================

    for (let policial of policiais) {

        ctx.fillStyle =
            "#e74c3c";


        ctx.fillRect(

            policial.x,

            policial.y,

            policial.largura,

            policial.altura

        );


        // olhos

        ctx.fillStyle =
            "white";


        ctx.fillRect(

            policial.x + 6,

            policial.y + 6,

            5,

            5

        );


        ctx.fillRect(

            policial.x + 17,

            policial.y + 6,

            5,

            5

        );

    }

}


// ==========================================
// DESENHAR CHAVE
// ==========================================

function desenharChave(x, y) {

    ctx.fillStyle =
        "gold";


    ctx.beginPath();

    ctx.arc(

        x,

        y,

        9,

        0,

        Math.PI * 2

    );

    ctx.fill();


    ctx.fillRect(

        x,

        y - 3,

        24,

        6

    );

}


// ==========================================
// LOOP
// ==========================================

function loop() {

    if (!jogoTerminado) {

        moverJogador();

        moverPoliciais();

        verificarPlataforma();

        verificarChaves();

        verificarPoliciais();

        verificarPorta();

        desenhar();

    }


    requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
